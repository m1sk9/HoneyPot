# Coverage reporting configuration.
#
# The bot's Discord I/O boundaries (real HTTP calls in `execute_ban` and the
# gateway event handlers) cannot be exercised without a live connection, so
# coverage targets are informational: they are reported on the PR but never
# block merging. Pure logic (detection predicates, formatting, the dedup
# guard) is unit-tested directly.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  require_changes: false

# These files are entirely a Discord I/O boundary, so none of them can be
# exercised without a live connection; excluding them keeps the coverage signal
# meaningful:
# - `interaction.rs`: button handling (ban/unban calls and interaction
#   responses). Its pure logic (`custom_id` parsing, embed builders) lives in
#   and is unit-tested from `ban.rs`.
# - `handler.rs`: gateway event dispatch into the ban paths.
# - `main.rs`: process bootstrap and the gateway shard loop.
# Files that mix testable pure logic with I/O (`ban.rs`, `commands.rs`, ...)
# are NOT ignored: Codecov only ignores whole paths, and per-function exclusion
# (`coverage(off)`) would need a nightly toolchain in CI.
ignore:
  - "src/discord/interaction.rs"
  - "src/discord/handler.rs"
  - "src/main.rs"
