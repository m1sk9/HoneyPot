[package]
name = "honeypot"
version = "0.6.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/m1sk9/HoneyPot"
readme = "README.md"
description = "A Discord bot that automatically bans spam bots via honeypot roles and channels."

[features]
# Compiles in the embed preview mode (`src/discord/preview.rs`). When enabled,
# running the binary posts one of every honeypot log embed to the channel named
# by HONEYPOT_PREVIEW_CHANNEL and exits, instead of connecting to the gateway.
# Off by default, so the preview code and its fabricated sample data are absent
# from the production build. Enable with `cargo run --features preview`.
preview = []

[dependencies]
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "zstd"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder", "snowflake"] }
twilight-mention = "0.17.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror = "2.0.18"
